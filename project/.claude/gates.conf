# Quality Gates commands — run them only through `.claude/scripts/gates.sh`.
# Empty value = gate skipped (⏭️).
# Markers: {files} changed files · {tests} changed test files · {dirs} their folders · {fr} an FR ID (ORDER-01) · {fr_id} the same in snake case (order_01).
# TEST_FR MUST print each test name — the script passes an FR only when its ID appears in the output.
# TEST_FR MUST match the whole ID — e.g. `{fr}\b` — so ORDER-01 does not also run ORDER-010.
# A scoped command whose marker expands to nothing falls back to its full command.
# The script sources this file: a command with `$` (a loop, `$(…)`) MUST use single quotes, or it expands too early.

APP_DIR="[e.g. app · . for the repo root]"

# FORMAT_* rewrites files in place before lint — it never blocks on style, only on a syntax error.
FORMAT_SCOPED="[e.g. npx prettier --write --ignore-unknown {files} · ruff format {files} · empty]"
FORMAT_FULL="[e.g. npx prettier --write --ignore-unknown src · ruff format . · empty]"
LINT_SCOPED="[e.g. npx oxlint {files} · ruff check {files}]"
LINT_FULL="[e.g. npm run lint · ruff check .]"
BUILD="[e.g. npm run build · mypy . · go build ./... · empty]"
TEST_SCOPED="[e.g. npx vitest related {files} --run --passWithNoTests · pytest {dirs}]"
TEST_FULL="[e.g. npm test -- --reporter=dot · pytest -q]"
TEST_FR="[e.g. npx vitest run -t '{fr}\b' --reporter=verbose · pytest -v -k '{fr_id}']"
AUDIT="[e.g. npm audit --audit-level=high · pip-audit · govulncheck ./... · cargo audit]"
MANIFESTS="[e.g. package.json package-lock.json · pyproject.toml uv.lock · go.mod go.sum · Cargo.toml Cargo.lock]"
